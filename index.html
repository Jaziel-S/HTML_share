<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Index</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      color: #2c3e50;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 {
      text-align: center;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
      max-width: 600px;
      margin: auto;
    }
    li {
      margin: 8px 0;
    }
    .submenu {
      display: none;
      margin-left: 20px;
    }
    .menu-item {
      cursor: pointer;
      font-weight: bold;
      color: #2c3e50;
      display: inline-block;
    }
    .menu-item:hover {
      color: #2980b9;
    }
    .arrow {
      margin-left: 5px;
      font-size: 12px;
      color: #555;
    }
    a {
      text-decoration: none;
      color: #2c3e50;
    }
    a:hover {
      text-decoration: underline;
      color: #2980b9;
    }

    /* 🌙 自动夜间模式 */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #ddd;
      }
      .menu-item {
        color: #ddd;
      }
      a {
        color: #ddd;
      }
      a:hover {
        color: #66ccff;
      }
      .arrow {
        color: #aaa;
      }
    }
  </style>
</head>
<body>
  <h1>Jaziel_分享的界面_菜单导航</h1>
  
  <ul>
    <li>
      <span class="menu-item" onclick="toggleMenu('research', this)"> 研究 <span class="arrow">▼</span></span>
      <ul id="research" class="submenu">
        <li><a href="ABAQUS_2020常见问题_reader.html"  target="_blank" rel="noopener noreferrer" > ABAQUS_2020常见问题 </a></li>
        <li><a href="Dynaform5.9.4_B柱冲压仿真_reader.html"  target="_blank" rel="noopener noreferrer" > Dynaform5.9.4_冲压仿真 </a></li>
      </ul>
    </li>
    
    <li>
      <span class="menu-item" onclick="toggleMenu('reports', this)"> 笔记 <span class="arrow">▼</span></span>
      <ul id="reports" class="submenu">
        <li><a href="ELRS 接收机双输出共享：Arduino与Betaflight的飞行-地面混合控制架构_reader.html"  target="_blank" rel="noopener noreferrer" > elrs+arduino无人机控制方案 </a></li>
      </ul>
    </li>
    
    <li>
      <span class="menu-item" onclick="toggleMenu('about', this)"> 其他 <span class="arrow">▼</span></span>
      <ul id="about" class="submenu">
        <li><a href="index.html"> 原地tp </a></li>
        <li><a href="https://github.com/Jaziel-S/md2html.git" target="_blank" rel="noopener noreferrer" > Markdown转HTML的工具 </a></li>
        <li><a href="https://github.com/Jaziel-S/HTML_share.git"  target="_blank" rel="noopener noreferrer" > HTML源文件仓库 </a></li>
      </ul>
    </li>
    
  </ul>

  <script>
    function toggleMenu(id, element) {
      const submenu = document.getElementById(id);
      const arrow = element.querySelector(".arrow");
      if (submenu.style.display === "block") {
        submenu.style.display = "none";
        arrow.textContent = "▼";
      } else {
        submenu.style.display = "block";
        arrow.textContent = "▲";
      }
    }
  </script>
</body>
</html>
